name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/wegather-portfolio-site-w40pat
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Requires a one-time manual step by the repo owner:
      # Settings → Pages → Build and deployment → Source: "GitHub Actions".
      # (enablement: true does not work here — GITHUB_TOKEN is not allowed to
      # create a Pages site: "Resource not accessible by integration".)
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
